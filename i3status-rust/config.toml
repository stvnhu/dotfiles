
[[block]]
block = "sound"
device_kind = "source"
format = " $icon $volume "
show_volume_when_muted = true

[[block]]
block = "sound"
device_kind = "sink"
format = " $icon $volume "
show_volume_when_muted = true

[[block]]
block = "net"
format = " $icon: $ip "
inactive_format = " <span foreground='#dc322f'>$icon: down</span> "

[[block]]
block = "battery"

[[block]]
block = "disk_space"

[[block]]
block = "cpu"

[[block]]
block = "memory"
format = " $icon $mem_used_percents "

[[block]]
block = "time"
interval = 1
format = " $timestamp.datetime(f:'%A %Y-%m-%d %H:%M:%S')"
